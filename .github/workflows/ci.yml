# Continuous integration: backend tests and the red-team suite offline, security scans, and the frontend build
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Tests must never reach the network: no model downloads, no cloud calls.
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  SECURITY_MODEL_MODE: "off"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  backend:
    name: Backend tests and attack suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies (CPU-only torch keeps the download small)
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r backend/requirements.txt
      - name: Tests (offline; the injection classifier is a static stand-in)
        working-directory: backend
        run: python -m pytest . -q
      - name: Attack suite (fails the build if any attack gets through)
        run: python scripts/run_attack_suite.py
      - name: Keep the attack report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attack-report
          path: |
            data/runtime/attack_report.json
            data/runtime/attack_report.md
          if-no-files-found: ignore

  security-scans:
    name: Bandit, pip-audit and gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks reads the whole history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Bandit (medium severity and above, application code)
        run: bandit -r backend -x "backend/.venv,*/tests/*" -ll
      - name: pip-audit (known vulnerabilities in installed packages)
        run: pip-audit --progress-spinner off
      - name: Gitleaks (committed secrets)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  frontend:
    name: Frontend build and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: npm audit, shipped dependencies (blocks on high and critical)
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit, including build tools (reported, not blocking; see docs/security.md)
        continue-on-error: true
        run: npm audit --audit-level=high
